<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>賽事預測</title>
<style>
:root{--cyan:#4c9ba1;--cyan-2:#7cb8bc;--cyan-3:#a6cfd1;--bg:#0d1517;--card:#162226;--card2:#1c2b30;--txt:#d9e4e5;--dim:#8fa3a6;--line:#24373c}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;font-size:14px;min-height:100vh}
.wrap{max-width:920px;margin:0 auto;padding:14px 12px 60px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:9px 0;border:none;border-radius:10px;background:var(--card);color:var(--dim);font-size:14px;cursor:pointer}
.tabs button.on{background:var(--cyan);color:#fff;font-weight:600}
.tabs button .n{opacity:.75;font-size:12px;margin-left:3px}
.daybar{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px}
.daybar button{flex-shrink:0;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--dim);font-size:12px;cursor:pointer}
.daybar button.on{border-color:var(--cyan);color:var(--cyan);font-weight:600}
.srow{display:flex;margin-bottom:8px}
.srow input{flex:1;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--txt);font-size:14px;outline:none}
.srow input:focus{border-color:var(--cyan)}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.card:hover{background:var(--card2)}
.r1{display:flex;align-items:center;gap:8px}
.comp{font-size:11px;color:var(--cyan-2);background:rgba(76,155,161,.12);padding:2px 7px;border-radius:6px;flex-shrink:0}
.tm{flex:1;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kt{font-size:11px;color:var(--dim);flex-shrink:0}
.score{font-size:18px;font-weight:700;font-family:ui-monospace,monospace;flex-shrink:0}
.score.miss{color:var(--dim);font-size:14px}
.r2{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.prob{display:flex;gap:2px;height:5px;border-radius:3px;overflow:hidden;flex:1;min-width:120px}
.prob i{display:block;height:100%}
.ph{background:var(--cyan)}.pd{background:#3d5359}.pa{background:#5a4a3a}
.pv{white-space:nowrap}
.lv{white-space:nowrap;color:var(--cyan-3)}
.status-tag{font-size:10px;padding:1px 6px;border-radius:5px;flex-shrink:0}
.st-live{background:#8a3a3a;color:#fff}.st-pre{background:#2a4148;color:var(--cyan-2)}
.detail{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px}
.dhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.dtitle{font-size:16px;font-weight:700;flex:1}
.back{border:1px solid var(--line);background:transparent;color:var(--dim);padding:5px 12px;border-radius:8px;cursor:pointer;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
th{color:var(--dim);font-weight:500;text-align:right;padding:5px 8px;border-bottom:1px solid var(--line);font-size:12px}
td{padding:6px 8px;text-align:right;border-bottom:1px solid rgba(36,55,60,.5);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
tr.mark td{color:var(--cyan);font-weight:600;background:rgba(76,155,161,.07)}
.sec{font-size:13px;color:var(--cyan-2);margin:12px 0 2px;font-weight:600}
.factor{font-size:12px;color:var(--dim);line-height:1.7;padding:4px 0;border-bottom:1px solid rgba(36,55,60,.4)}
.factor b{color:var(--txt);font-weight:500}
.err{text-align:center;padding:60px 20px;color:var(--dim)}
.err b{display:block;color:var(--cyan);font-size:16px;margin-bottom:10px}
.err button{margin-top:14px;padding:8px 24px;border:none;border-radius:8px;background:var(--cyan);color:#fff;font-size:14px;cursor:pointer}
.load{text-align:center;padding:60px;color:var(--dim)}
.spin{display:inline-block;width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--cyan);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:10px}
@keyframes sp{to{transform:rotate(360deg)}}
footer{text-align:center;color:#5a6e71;font-size:11px;padding:30px 0 0}
a{color:var(--cyan-2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" id="tabs">
    <button data-t="pre">未開賽<span class="n" id="n-pre"></span></button>
    <button data-t="live">比賽中<span class="n" id="n-live"></span></button>
    <button data-t="ft">已完場<span class="n" id="n-ft"></span></button>
  </div>
  <div class="srow"><input id="q" placeholder="搜尋隊名或聯賽…"></div>
  <div class="daybar" id="daybar" style="display:none"></div>
  <div id="main"><div class="load"><div class="spin"></div><br>載入中…</div></div>
  <footer>機率由 Poisson＋Dixon-Coles 模型計算 · 僅供參考，不構成任何投注建議</footer>
</div>
<script>
'use strict';
var API='https://oddsapi.2828666.xyz/fbW8FCX0tNblXanTXGyTUB';
var tab='pre', q='', day=null, cache=null, detailOpen=null;

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function pct(x){return x==null?'—':(x*100).toFixed(1)+'%'}
function hhmm(iso){var d=new Date(iso);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function dkey(iso){return iso.slice(0,10)}
function dlabel(k){var d=new Date(k+'T00:00:00');var m=d.getMonth()+1,dd=d.getDate();var w=['日','一','二','三','四','五','六'][d.getDay()];return m+'/'+dd+' 週'+w}
function fmtLine(l){if(l==null)return '—';return (l>0?'+':'')+l}

function probBar(p){var h=p.fin_h*100,d=p.fin_d*100;return '<div class="prob"><i class="ph" style="width:'+h+'%"></i><i class="pd" style="width:'+d+'%"></i><i class="pa" style="width:'+(100-h-d)+'%"></i></div>'}

function cardHTML(r){
  var live=r.status==='live', ft=r.status==='ft';
  var score= ft||live
    ? (r.sh!=null ? '<div class="score">'+r.sh+' – '+r.sa+'</div>'
                  : '<div class="score miss">—</div>')
    : '';
  var st=live?'<span class="status-tag st-live">LIVE</span>':'';
  return '<div class="card" data-id="'+r.id+'">'
    +'<div class="r1"><span class="comp">'+esc(r.comp)+'</span>'
    +'<span class="tm">'+esc(r.home)+' vs '+esc(r.away)+'</span>'+st+score
    +'<span class="kt">'+(ft?'':hhmm(r.kick))+'</span></div>'
    +(r.pred&&r.pred.fin_h!=null
      ?'<div class="r2">'+probBar(r.pred)
      +'<span class="pv">主 '+pct(r.pred.fin_h)+' 和 '+pct(r.pred.fin_d)+' 客 '+pct(r.pred.fin_a)+'</span>'
      +(r.pred.main_line!=null?'<span class="lv">盤口 '+fmtLine(r.pred.main_line)+' cover '+pct(r.pred.cover)+'</span>':'')+'</div>':'')
    +'</div>';
}

function render(){
  var rows=cache||[];
  if(q) rows=rows.filter(function(r){return (r.home+' '+r.away+' '+r.comp+' '+r.comp_name).toLowerCase().indexOf(q)>=0});
  var groups={pre:[],live:[],ft:[]};
  var groups={pre:[],live:[],ft:[]};
  rows.forEach(function(r){var s=r.status==='live'?'live':(r.status==='ft'?'ft':'pre');groups[s].push(r)});
  document.getElementById('n-pre').textContent=groups.pre.length?' '+groups.pre.length:'';
  document.getElementById('n-live').textContent=groups.live.length?' '+groups.live.length:'';
  document.getElementById('n-ft').textContent=groups.ft.length?' '+groups.ft.length:'';

  var el=document.getElementById('main');
  if(detailOpen){renderDetail(detailOpen);return}
  document.getElementById('daybar').style.display=(tab==='ft'&&!q&&groups.ft.length)?'flex':'none';
  var list=groups[tab]||[];
  var html='';
  if(tab==='ft'){
    var days={};list.forEach(function(r){(days[dkey(r.kick)]=days[dkey(r.kick)]||[]).push(r)});
    var dk=Object.keys(days).sort().reverse();
    if(day&&days[day])dk=[day];
    if(!dk.length)html='<div class="err">沒有已完場賽事</div>';
    dk.forEach(function(k){
      if(!q&&Object.keys(days).length>1)html+='<div class="sec">'+dlabel(k)+'（'+days[k].length+' 場）</div>';
      days[k].forEach(function(r){html+=cardHTML(r)});
    });
    // daybar
    var db=document.getElementById('daybar');var bh='';
    Object.keys(days).sort().reverse().forEach(function(k){bh+='<button data-d="'+k+'" class="'+(k===(day||dk[0])?'on':'')+'">'+dlabel(k)+'</button>'});
    db.innerHTML=bh;
  }else{
    if(!list.length)html='<div class="err">'+(q?'沒有符合的賽事':'暫無賽事')+'</div>';
    list.forEach(function(r){html+=cardHTML(r)});
  }
  el.innerHTML=html;
}

function renderDetail(id){
  var el=document.getElementById('main');
  el.innerHTML='<div class="load"><div class="spin"></div><br>載入詳情…</div>';
  fetch(API+'/pred/'+id).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(p){
    var ahd=p.ahd||{},rows=(ahd.rows||[]).filter(function(r){return Math.abs(r.line)<=2.01});
    var mark=ahd.mark;
    var h='';
    h+='<div class="dhead"><div class="dtitle">'+esc(p.home)+' vs '+esc(p.away)+'</div><button class="back" id="bk">返回</button></div>';
    h+='<div style="color:var(--dim);font-size:12px;margin-bottom:6px">'+esc(p.compName||p.comp)+' · '+esc(p.kickoff?new Date(p.kickoff).toLocaleString('zh-HK',{hour12:false}):'')+'</div>';
    // 1X2
    var f=p.fin||{};
    h+='<div class="sec">主勝／和／客勝</div><table><tr><th></th><th>機率</th><th>公平賠率</th></tr>'
      +'<tr><td>主勝</td><td>'+pct(f.h)+'</td><td>'+(f.h? (1/f.h).toFixed(2):'—')+'</td></tr>'
      +'<tr><td>和局</td><td>'+pct(f.d)+'</td><td>'+(f.d? (1/f.d).toFixed(2):'—')+'</td></tr>'
      +'<tr><td>客勝</td><td>'+pct(f.a)+'</td><td>'+(f.a? (1/f.a).toFixed(2):'—')+'</td></tr></table>';
    if(f.ml)h+='<div style="font-size:12px;color:var(--dim)">信心：'+esc(f.conf||'—')+'</div>';
    // AHD
    if(rows.length){
      h+='<div class="sec">亞洲盤（讓球方視角）</div><table><tr><th>盤口</th><th>讓球方</th><th>全贏</th><th>半贏</th><th>走水</th><th>半輸</th><th>全輸</th><th>cover</th></tr>';
      rows.forEach(function(r){
        var m=Math.abs(r.line-mark)<0.001;
        h+='<tr'+(m?' class="mark"':'')+'><td>'+fmtLine(r.line)+'</td><td>'+(r.fav==='a'?'客':'主')+'</td>'
          +'<td>'+pct(r.win)+'</td><td>'+(r.halfwin?pct(r.halfwin):'—')+'</td><td>'+(r.push?pct(r.push):'—')+'</td>'
          +'<td>'+(r.halflose?pct(r.halflose):'—')+'</td><td>'+pct(r.lose)+'</td><td>'+pct(r.cover)+'</td></tr>';
      });
      h+='</table>';
    }
    // 大小球 / BTTS
    var dg=p.diag||{};
    if(dg.o25!=null){
      h+='<div class="sec">入球盤</div><table>'
        +'<tr><td>大 2.5 球</td><td>'+pct(dg.o25)+'</td></tr>'
        +(dg.o35!=null?'<tr><td>大 3.5 球</td><td>'+pct(dg.o35)+'</td></tr>':'')
        +(dg.btts!=null?'<tr><td>雙方均有入球</td><td>'+pct(dg.btts)+'</td></tr>':'')
        +'</table>';
    }
    if(dg.tops&&dg.tops.length){
      h+='<div class="sec">最可能比分</div><table>';
      dg.tops.forEach(function(t){h+='<tr><td>'+esc(t.s)+'</td><td>'+pct(t.p)+'</td></tr>'});
      h+='</table>';
    }
    if(p.handicap&&p.handicap.mark!=null)h+='<div style="font-size:12px;color:var(--dim)">馬會盤口：'+fmtLine(p.handicap.mark)+'</div>';
    // 計算依據
    if(p.factors&&p.factors.length){
      h+='<div class="sec">計算依據</div>';
      p.factors.forEach(function(x){h+='<div class="factor"><b>'+esc(x.p)+'</b> — '+esc(x.txt)+(x.src?' <a href="'+esc(x.url||'#')+'" target="_blank" rel="noopener">'+esc(x.src)+'</a>':'')+'</div>'});
    }
    h+='<div style="font-size:11px;color:#5a6e71;margin-top:14px">機率由 Poisson＋Dixon-Coles 模型計算 · 僅供參考，不構成任何投注建議</div>';
    el.innerHTML='<div class="detail">'+h+'</div>';
    document.getElementById('bk').onclick=function(){detailOpen=null;render()};
  }).catch(function(){
    el.innerHTML='<div class="err"><b>載入失敗</b>請稍後重試<button onclick="openDetail(\''+id+'\')">重試</button></div>';
  });
}
window.openDetail=function(id){detailOpen=id;renderDetail(id)};

document.getElementById('tabs').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  tab=b.dataset.t;day=null;detailOpen=null;render();
});
document.getElementById('q').addEventListener('input',function(e){q=e.target.value.trim().toLowerCase();render()});
document.getElementById('daybar').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;day=b.dataset.d;render();
});
document.getElementById('main').addEventListener('click',function(e){
  var c=e.target.closest('.card');if(!c)return;openDetail(c.dataset.id);
});

function load(){
  var now=new Date();
  var from=new Date(now.getTime()-3*86400000).toISOString().slice(0,10);
  var to=new Date(now.getTime()+7*86400000).toISOString().slice(0,10);
  fetch(API+'/matches?from='+from+'&to='+to+'&limit=2000').then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(d){cache=d.rows||[];render()})
    .catch(function(){
      document.getElementById('main').innerHTML='<div class="err"><b>無法連接數據 API</b>請檢查網絡或稍後再試<button onclick="load()">重試</button></div>';
    });
}
load();
setInterval(load, 5*60*1000);
</script>
</body>
</html>
